[project]
name = "speak-to-print"
version = "0.1.0"
description = "KDE Plasma (Wayland) için tamamen yerel çalışan Türkçe dikte uygulaması"
requires-python = ">=3.14"
dependencies = [
    # PyAV 19, faster-whisper 1.2.1'in kullandığı `metadata_errors` parametresini kaldırdı.
    # faster-whisper'ın geliştirme kodunda düzeltildi; yeni sürümü çıkınca bu sınır kalkabilir.
    "av>=18,<19",
    "dbus-fast>=5.2.0",
    "evdev>=2.0.0",
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12,<13",
    "pyside6-addons>=6.12.0",
]

[project.scripts]
speak-to-print = "speak_to_print:main"

[tool.uv]
# Sistem Python'u yerine uv'nin kendi kopyasını kullan: pacman sistem Python'unu
# yükselttiğinde .venv bozulmasın.
python-preference = "only-managed"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
